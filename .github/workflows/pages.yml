name: pages

# Builds the static dashboard in site/, refreshes the public Kalshi data snapshot
# (site/data/*.json, generated, not committed) and deploys to GitHub Pages from main.

on:
  push:
    branches: [main, arena/64d89c6c-kalshidash2]
  schedule:
    - cron: '17 * * * *'   # hourly, UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public Kalshi market data (read-only, unauthenticated)
        run: node scripts/collect.mjs
      - name: Check site (links, JSON, sources)
        run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
