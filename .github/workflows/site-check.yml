name: Static site link check

# Checks the published site itself (the repository root is what GitHub Pages
# serves) and runs the page-runtime harness that executes every page's
# JavaScript against a DOM shim with live-shaped API fixtures.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the signing dependency for the WebSocket client tests
        run: pip install --quiet cryptography
      - name: Test link checker
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Kalshi WebSocket client unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate local links and anchors in the published site
        run: python tools/check_site_links.py .
      - name: Exchange-status 5xx caveat regression tests
        run: node --test tests/exchange-status.test.mjs
      - name: Alert engine unit tests
        run: node --test tests/alerts-core.test.mjs
      - name: Live-feed unit tests
        run: node --test tests/live-core.test.mjs tests/live-feed-state.test.mjs
      - name: Taxonomy + multivariate classifier tests
        run: node --test tests/taxonomy.test.mjs
      - name: Simulator unit tests
        run: node --test tests/simulator-core.test.mjs
      # Official traded-dollar volume (GET /markets/trades): the arithmetic, the
      # documented query bounds, and the rule that an incomplete read is never
      # presented as a total.
      - name: Traded-dollar volume unit tests
        run: node --test tests/dollar-volume.test.mjs
      # The Sources page and its register must not drift apart, and no live
      # market value may be transcribed into either.
      - name: Sources register tests
        run: node --test tests/sources-page.test.mjs
      - name: Chart jump-detection unit tests
        run: node --test tests/jumps.test.mjs tests/historical-tier.test.mjs
      - name: Chart X-axis label tests (seconds / minutes / hours / days)
        run: node --test tests/chart-axis.test.mjs
      - name: Settlement-result semantics tests (yes / no / scalar)
        run: node --test tests/result-semantics.test.mjs
      - name: Activity proxy + snapshot label tests
        run: node --test tests/activity-proxy.test.mjs
      - name: Published official-wording tests
        run: node --test tests/official-wording.test.mjs
      - name: Live-probe gas rule (offline proof)
        run: node --test tests/dom/live-site-no-match.test.mjs
      # Offline unit tests for the live-render verifier's parsing/classification
      # helpers, so their comma/rate-limit handling cannot regress without a
      # network run. `main`'s gas rule above is kept; this covers the refusal
      # classification and the comma-tolerant scan count.
      - name: Live-render verifier parsing tests
        run: node --test tests/dom/live-site-assertions.test.mjs
      - name: Page runtime and local-link check
        run: node tools/verify/page-runtime-check.mjs
