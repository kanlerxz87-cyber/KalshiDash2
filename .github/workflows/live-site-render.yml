name: live-site-render

# Runs the published site's REAL page code in jsdom against the LIVE Kalshi demo
# API and asserts what actually renders: the Overview board and its five topic
# cards, and the Gas page finding its live event.
#
# Why this exists: every other check in this repo either uses fixtures or reads
# static HTML. Neither proves the shipped controllers can talk to the exchange.
# The build sandbox cannot open TLS to *.kalshi.co ("socket disconnected before
# secure TLS connection was established"), so this runs on a GitHub-hosted
# runner.
#
# The report is uploaded as a run artifact rather than committed, so parallel
# verification jobs cannot race to push commits to main (same rule as
# verify-live.yml).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "categories/**.html"
      - "assets/js/**.js"
      - "tests/dom/live-site.mjs"
      - "tests/dom/live-site-assertions.mjs"
      - ".github/workflows/live-site-render.yml"

permissions:
  contents: read

concurrency:
  group: live-site-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DOM harness dependencies
        working-directory: tests/dom
        run: npm ci

      - name: Live render check
        id: live
        working-directory: tests/dom
        run: |
          set +e
          node live-site.mjs > "$GITHUB_WORKSPACE/live-site-render.raw" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/live-site-render.raw"

      - name: Write report
        if: always()
        run: |
          {
            echo "# Live site render check"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Started (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Runner | GitHub Actions \`Linux\`, node $(node --version) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Script | \`tests/dom/live-site.mjs\` — real page controllers, real \`fetch\` to https://external-api.demo.kalshi.co |"
            echo "| Exit status | \`${{ steps.live.outputs.status }}\` (0 = every assertion passed) |"
            echo
            echo '```'
            cat live-site-render.raw 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > live-site-render.md
          rm -f live-site-render.raw
          cat live-site-render.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-render-report
          path: live-site-render.md

      # Exit 0 = every assertion passed. Exit 1 = a real content regression, which
      # fails the job. Exit 2 = the exchange refused or was unreachable (HTTP
      # 429/5xx or transport), so the content assertions could not be made: that
      # is reported as a warning annotation instead of a pass. A rate limit is not
      # a site defect, but calling it green would hide a broken exchange.
      - name: Report the outcome
        if: always()
        run: |
          case "${{ steps.live.outputs.status }}" in
            0) echo "### live-site-render: PASS" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::warning title=live-site-render inconclusive::The Kalshi demo API refused or was unreachable, so content assertions could not be made. This run is not a pass. See the report artifact."
               echo "### live-site-render: INCONCLUSIVE (exchange unavailable, not a pass)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error title=live-site-render failed::A content assertion failed against the live demo API. Exit status ${{ steps.live.outputs.status }}."
               echo "### live-site-render: FAIL" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Fail the job only on a real regression
        if: always()
        run: |
          status="${{ steps.live.outputs.status }}"
          if [ "$status" = "1" ]; then
            echo "live render check failed"
            exit 1
          fi
          echo "status=$status (0=pass, 2=inconclusive)"
