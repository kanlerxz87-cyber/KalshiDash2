name: live-site-render

# Runs the published site's REAL page code in jsdom against the LIVE Kalshi demo
# API and asserts what actually renders: the Overview board and its five topic
# cards, and the Gas page finding its live event.
#
# Why this exists: every other check in this repo either uses fixtures or reads
# static HTML. Neither proves the shipped controllers can talk to the exchange.
# The build sandbox cannot open TLS to *.kalshi.co ("socket disconnected before
# secure TLS connection was established"), so this runs on a GitHub-hosted
# runner.
#
# The report is uploaded as a run artifact rather than committed, so parallel
# verification jobs cannot race to push commits to main (same rule as
# verify-live.yml).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "categories/**.html"
      - "assets/js/**.js"
      - "tests/dom/live-site.mjs"
      - ".github/workflows/live-site-render.yml"

permissions:
  contents: read

concurrency:
  group: live-site-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DOM harness dependencies
        working-directory: tests/dom
        run: npm ci

      - name: Live render check
        id: live
        working-directory: tests/dom
        run: |
          set +e
          node live-site.mjs > "$GITHUB_WORKSPACE/live-site-render.raw" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/live-site-render.raw"

      - name: Write report
        if: always()
        run: |
          {
            echo "# Live site render check"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Started (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Runner | GitHub Actions \`Linux\`, node $(node --version) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Script | \`tests/dom/live-site.mjs\` — real page controllers, real \`fetch\` to https://external-api.demo.kalshi.co |"
            echo "| Exit status | \`${{ steps.live.outputs.status }}\` (0 = every assertion passed) |"
            echo
            echo '```'
            cat live-site-render.raw 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > live-site-render.md
          cat live-site-render.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-render-report
          path: live-site-render.md

      # The run log download is not always reachable from every environment, but
      # check-run annotations always are (REST: /check-runs/{id}/annotations).
      # Each output line becomes one annotation, so the exact assertion that
      # failed is readable without the log archive.
      - name: Surface every output line as a check-run annotation
        if: always()
        run: |
          if [ -s live-site-render.raw ]; then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=live-site-render::$line"
            done < live-site-render.raw
          fi

      - name: Publish the check output to the job summary
        if: always()
        run: |
          {
            echo "## Live site render check"
            echo
            echo "Commit \`$GITHUB_SHA\` · exit status \`${{ steps.live.outputs.status }}\` (0 = every assertion passed)"
            echo
            echo '```'
            cat live-site-render.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the raw capture
        if: always()
        run: rm -f live-site-render.raw

      - name: Fail the job if the render check failed
        if: always()
        run: test "${{ steps.live.outputs.status }}" = "0"
