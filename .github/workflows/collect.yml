name: Collect Kalshi demo data

# Runs the collector on a schedule and on demand, then commits the snapshot to
# docs/data/ so the static GitHub Pages site renders real, sourced data.
#
# Why GitHub Actions: the visitor's browser is not used for collection, so the
# site has no cross-origin dependency on the Kalshi API at page-view time, and
# every snapshot is reproducible from the run log (the collector records every
# URL it requested, with status and timestamp).
#
# Official sources:
#   environments  https://docs.kalshi.com/getting_started/api_environments
#   rate limits   https://docs.kalshi.com/getting_started/rate_limits
#   Pages         https://docs.github.com/en/pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to commit the snapshot to"
        required: false
        default: "main"
  push:
    branches: [main]
    paths:
      - "scripts/collect_kalshi.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: kalshi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          KALSHI_BASE: https://external-api.demo.kalshi.co/trade-api/v2
          KALSHI_FALLBACK_BASE: https://demo-api.kalshi.co/trade-api/v2
          OUT_DIR: docs/data
          PAGE_LIMIT: "1000"
          MAX_PAGES: "40"
          REQUEST_SLEEP: "0.2"
        run: |
          set -euo pipefail
          python scripts/collect_kalshi.py
          ls -la docs/data
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("docs/data").glob("*.json")):
              d = json.loads(p.read_text())
              print(f"{p.name:22s} generated_at={d.get('generated_at')} error={d.get('error')}")
          PY

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name  "kalshi-collector[bot]"
          git config user.email "kalshi-collector@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$TARGET"
          git push origin "HEAD:$TARGET"
