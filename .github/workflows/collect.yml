name: Collect demo snapshot

# Refreshes data/snapshot.json from the official Kalshi DEMO REST API.
#
# What the snapshot is: a repository evidence artifact. It backs the offline
# verification tables (tools/test_collect.py compares the committed file against
# the generator's own disclosure notes) and gives a reviewable capture of one
# collector run.
#
# What it is NOT: a fallback the site reads. No published page fetches
# data/snapshot.json — every board, chart and alert on the live site calls the
# demo API directly from the browser (CORS-verified against
# https://external-api.demo.kalshi.co). The earlier header claimed an "offline
# fallback" that has never existed; Flagged SB2 recorded that and this is the
# correction. See reports/verify-8f3c331c.md §7 for the re-check.
on:
  workflow_dispatch:
    inputs:
      top_series:
        description: "Max series per topic"
        default: "40"
      top_book:
        description: "Max order books to capture"
        default: "20"
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect snapshot
        run: |
          python3 scripts/collect.py \
            --out data/snapshot.json \
            --top-series "${{ github.event.inputs.top_series || '40' }}" \
            --top-book "${{ github.event.inputs.top_book || '20' }}"

      - name: Summarise
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/snapshot.json"))
          m = d["_meta"]
          print("generated_at:", m["generated_at"])
          print("api_calls:", m["api_calls"])
          print("errors:", len(m["errors"]))
          for k, t in d["topics"].items():
              print(f"  {k:10s} series={t['series_count']:4d} events={len(t['events']):4d} markets={len(t['markets']):4d}  ({t['rule']})")
          print("orderbooks:", len(d["orderbooks"]), "candles:", len(d["candles"]))
          for e in m["errors"][:5]:
              print("  ERR", e[:160])
          PY

      # Guards the disclosure wording: this job commits with [skip ci], so without
      # this gate a generator wording change could land on main with the metadata
      # suites red (observed at bbdc3a0 — see Session e2718295 on COORDINATION.md).
      - name: Validate snapshot metadata against the collector and the site
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          node --test tests/activity-proxy.test.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(data): refresh Kalshi demo snapshot [skip ci]"
          # `main` moves while this job runs, so a bare `git push` can be rejected.
          # The previous step logged "push skipped" and still exited 0, which left
          # the snapshot stale with no signal (observed 2026-11-21: two successful
          # runs, no new chore(data) commit). Rebase onto current main and retry;
          # fail the job if the refreshed snapshot cannot be published.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "rebase onto origin/main failed on attempt ${attempt}"
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              echo "pushed refreshed snapshot on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push the refreshed snapshot to main after 4 attempts"
          exit 1
