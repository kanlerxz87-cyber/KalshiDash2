name: Static site link check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test link checker
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate local links and anchors in the published site
        run: python tools/check_site_links.py docs
