name: Collect demo snapshot

# Refreshes data/snapshot.json from the official Kalshi DEMO REST API.
# The snapshot backs the repo's verification tables and the site's offline
# fallback. The live site itself reads the API directly from the browser
# (CORS-verified against https://external-api.demo.kalshi.co).
on:
  workflow_dispatch:
    inputs:
      top_series:
        description: "Max series per topic"
        default: "40"
      top_book:
        description: "Max order books to capture"
        default: "20"
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect snapshot
        run: |
          python3 scripts/collect.py \
            --out data/snapshot.json \
            --top-series "${{ github.event.inputs.top_series || '40' }}" \
            --top-book "${{ github.event.inputs.top_book || '20' }}"

      - name: Summarise
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/snapshot.json"))
          m = d["_meta"]
          print("generated_at:", m["generated_at"])
          print("api_calls:", m["api_calls"])
          print("errors:", len(m["errors"]))
          for k, t in d["topics"].items():
              print(f"  {k:10s} series={t['series_count']:4d} events={len(t['events']):4d} markets={len(t['markets']):4d}  ({t['rule']})")
          print("orderbooks:", len(d["orderbooks"]), "candles:", len(d["candles"]))
          for e in m["errors"][:5]:
              print("  ERR", e[:160])
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(data): refresh Kalshi demo snapshot [skip ci]"
            git push || echo "push skipped (branch protected or diverged)"
          fi
