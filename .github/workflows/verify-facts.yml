name: verify-facts
# Temporary verification job. Captures authoritative, reproducible facts from the
# official Kalshi DEMO API on a GitHub-hosted runner (the editing sandbox cannot open
# TLS connections to Kalshi hosts) and commits the report back to the branch so the
# findings are reviewable as a file with a permanent, linkable URL.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/verify/**"

permissions:
  contents: write

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe demo API
        run: |
          set +e
          BASE=https://external-api.demo.kalshi.co/trade-api/v2
          OUT=reports/verify-facts-v2.md
          mkdir -p reports
          {
          echo "# Verified facts (v2) — Kalshi DEMO API"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Captured (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          echo "| Runner | GitHub Actions \`ubuntu-latest\` |"
          echo "| Base URL | \`$BASE\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo
          echo '## A. Deprecated v1 order route — what the exchange says'
          echo '```'
          curl -sS -i -X POST -H "Content-Type: application/json" -d '{}' "$BASE/portfolio/orders" | head -40
          echo '```'
          echo
          echo '## B. Highest-volume open markets (top 8 by `volume_fp`)'
          curl -sS "$BASE/markets?status=open&limit=1000" -o /tmp/m.json
          node -e '
            const j=require("/tmp/m.json");
            const ms=(j.markets||[]);
            console.log("");
            console.log("Markets returned:", ms.length, "| cursor present:", !!j.cursor);
            console.log("");
            console.log("| Ticker | Event | Series | Last | YES bid | YES ask | Vol (fp) | OI (fp) | Tick structure |");
            console.log("| --- | --- | --- | --- | --- | --- | --- | --- | --- |");
            ms.sort((a,b)=>Number(b.volume_fp||0)-Number(a.volume_fp||0)).slice(0,8).forEach(m=>{
              console.log(`| ${m.ticker} | ${m.event_ticker} | ${m.series_ticker||""} | ${m.last_price_dollars} | ${m.yes_bid_dollars} | ${m.yes_ask_dollars} | ${m.volume_fp} | ${m.open_interest_fp} | ${m.price_level_structure||""} |`);
            });
            console.log("");
            console.log("Price ranges of the top market (source of truth for valid order prices):");
            console.log("");
            const top=ms.sort((a,b)=>Number(b.volume_fp||0)-Number(a.volume_fp||0))[0];
            console.log("```json");
            console.log(JSON.stringify(top.price_ranges,null,1));
            console.log("```");
          '
          echo
          echo '## C. Candlesticks for a market that actually has volume'
          TICKER=$(node -e '
            const j=require("/tmp/m.json");
            const ms=(j.markets||[]).filter(m=>Number(m.volume_fp||0)>0);
            ms.sort((a,b)=>Number(b.volume_fp||0)-Number(a.volume_fp||0));
            console.log(ms.length?ms[0].ticker:"");
          ')
          SERIES=$(node -e '
            const j=require("/tmp/m.json");
            const ms=(j.markets||[]).filter(m=>Number(m.volume_fp||0)>0);
            ms.sort((a,b)=>Number(b.volume_fp||0)-Number(a.volume_fp||0));
            console.log(ms.length?(ms[0].series_ticker||""):"");
          ')
          echo ""
          echo "Ticker \`$TICKER\` · series \`$SERIES\`"
          if [ -n "$TICKER" ] && [ -n "$SERIES" ]; then
            END=$(date +%s)
            for PI in 1 60 1440; do
              echo ""
              echo "\`period_interval=$PI\` (minutes) over the last 24h:"
              echo '```json'
              curl -sS "$BASE/series/$SERIES/markets/$TICKER/candlesticks?start_ts=$((END-86400))&end_ts=$END&period_interval=$PI" | head -c 700
              echo
              echo '```'
            done
            echo ""
            echo "Unsupported interval \`period_interval=5\`:"
            echo '```'
            curl -sS -o /tmp/p5.json -w "HTTP %{http_code}\n" "$BASE/series/$SERIES/markets/$TICKER/candlesticks?start_ts=$((END-3600))&end_ts=$END&period_interval=5"
            head -c 400 /tmp/p5.json
            echo
            echo '```'
            echo ""
            echo "Millisecond timestamps (documented as rejected with 400):"
            echo '```'
            curl -sS -o /tmp/pm.json -w "HTTP %{http_code}\n" "$BASE/series/$SERIES/markets/$TICKER/candlesticks?start_ts=$(( (END-3600)*1000 ))&end_ts=$((END*1000))&period_interval=1"
            head -c 300 /tmp/pm.json
            echo
            echo '```'
            echo ""
            echo "Orderbook depth=5 for the same market:"
            echo '```json'
            curl -sS "$BASE/markets/$TICKER/orderbook?depth=5" | head -c 900
            echo
            echo '```'
            echo ""
            echo "Same orderbook with no price (unknown ticker) — 200 + empty arrays per docs:"
            echo '```'
            curl -sS -o /tmp/ob404.json -w "HTTP %{http_code}\n" "$BASE/markets/NOSUCHTICKER123/orderbook"
            head -c 200 /tmp/ob404.json
            echo
            echo '```'
            echo ""
            echo "Recent trades on the market (public, no auth):"
            echo '```json'
            curl -sS "$BASE/markets/trades?limit=3&ticker=$TICKER" | head -c 900
            echo
            echo '```'
          fi
          echo
          echo '## D. Settled markets — how resolution is reported'
          curl -sS "$BASE/markets?status=settled&limit=200" -o /tmp/sm.json
          node -e '
            const j=require("/tmp/sm.json");
            const ms=j.markets||[];
            const dist={};
            let withResult=0;
            for(const m of ms){dist[m.result||"(blank)"]=(dist[m.result||"(blank)"]||0)+1; if(m.result)withResult++;}
            console.log("");
            console.log("Settled markets returned:", ms.length);
            console.log("");
            console.log("| `result` value | Count |");
            console.log("| --- | --- |");
            Object.entries(dist).forEach(([k,v])=>console.log(`| ${k} | ${v} |`));
            console.log("");
            console.log("Markets carrying a non-blank result:", withResult, "of", ms.length);
            console.log("");
            console.log("Sample rows (API fields copied verbatim, no inference):");
            console.log("");
            console.log("| Ticker | Result | Status | Settlement value | Expiration value | Close time |");
            console.log("| --- | --- | --- | --- | --- | --- |");
            ms.slice(0,8).forEach(m=>console.log(`| ${m.ticker} | ${m.result||"(blank)"} | ${m.status} | ${m.settlement_value_dollars??m.settlement_value??""} | ${m.expiration_value||""} | ${m.close_time||""} |`));
          '
          echo
          echo '## E. Events with categories (taxonomy source of truth)'
          echo '```json'
          curl -sS "$BASE/events?limit=1&status=open&with_nested_markets=false" | head -c 900
          echo
          echo '```'
          echo
          echo '## F. Rate-limit headers observed on a public call'
          echo '```'
          curl -sS -D - -o /dev/null "$BASE/markets?limit=1" | grep -i "ratelimit\|retry-after\|x-kalshi"
          echo '```'
          } > "$OUT"
          cat "$OUT"

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "reports: verified facts v2 from Kalshi demo API [skip ci]"
          git push
